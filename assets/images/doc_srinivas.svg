<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad_doc_srinivas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow_doc_srinivas" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="500" fill="#0f172a"/>
  
  <!-- Subtle Background Pattern -->
  <circle cx="250" cy="200" r="180" fill="url(#bgGrad_doc_srinivas)" opacity="0.15"/>
  <circle cx="250" cy="200" r="130" fill="url(#bgGrad_doc_srinivas)" opacity="0.25"/>

  <!-- Doctor Avatar Circle -->
  <circle cx="250" cy="210" r="110" fill="url(#bgGrad_doc_srinivas)" filter="url(#shadow_doc_srinivas)"/>
  <circle cx="250" cy="210" r="104" fill="#1e293b"/>

  <!-- Doctor Silhouette / Portrait Vector -->
  <path d="M250,145 C220,145 195,170 195,205 C195,240 220,260 250,260 C280,260 305,240 305,205 C305,170 280,145 250,145 Z M250,270 C190,270 145,315 145,380 L355,380 C355,315 310,270 250,270 Z" fill="#34d399" opacity="0.95"/>

  <!-- Stethoscope Overlay Icon -->
  <g transform="translate(310, 240) scale(0.8)">
    <circle cx="30" cy="30" r="28" fill="#0f172a" stroke="#34d399" stroke-width="3"/>
    <path d="M20,20 C20,35 40,35 40,20 M30,35 L30,42" stroke="#34d399" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Name & Credentials Text Plate -->
  <rect x="30" y="370" width="440" height="100" rx="16" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" filter="url(#shadow_doc_srinivas)"/>
  
  <text x="250" y="410" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" fill="#ffffff" text-anchor="middle">Dr. Srinivas Rohit</text>
  <text x="250" y="435" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="15" fill="#34d399" text-anchor="middle">Implantologist Specialist</text>
  <text x="250" y="456" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="13" fill="#94a3b8" text-anchor="middle">MDS • Titanium Dental Implants</text>
</svg>