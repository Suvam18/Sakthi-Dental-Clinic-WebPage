<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad_doc_anupriya" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="shadow_doc_anupriya" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="500" fill="#0f172a"/>
  
  <!-- Subtle Background Pattern -->
  <circle cx="250" cy="200" r="180" fill="url(#bgGrad_doc_anupriya)" opacity="0.15"/>
  <circle cx="250" cy="200" r="130" fill="url(#bgGrad_doc_anupriya)" opacity="0.25"/>

  <!-- Doctor Avatar Circle -->
  <circle cx="250" cy="210" r="110" fill="url(#bgGrad_doc_anupriya)" filter="url(#shadow_doc_anupriya)"/>
  <circle cx="250" cy="210" r="104" fill="#1e293b"/>

  <!-- Doctor Silhouette / Portrait Vector -->
  <path d="M250,150 C220,150 190,175 190,210 C190,245 220,265 250,265 C280,265 310,245 310,210 C310,175 280,150 250,150 Z M250,275 C190,275 140,320 140,380 L360,380 C360,320 310,275 250,275 Z" fill="#2dd4bf" opacity="0.95"/>

  <!-- Stethoscope Overlay Icon -->
  <g transform="translate(310, 240) scale(0.8)">
    <circle cx="30" cy="30" r="28" fill="#0f172a" stroke="#2dd4bf" stroke-width="3"/>
    <path d="M20,20 C20,35 40,35 40,20 M30,35 L30,42" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Name & Credentials Text Plate -->
  <rect x="30" y="370" width="440" height="100" rx="16" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" filter="url(#shadow_doc_anupriya)"/>
  
  <text x="250" y="410" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" fill="#ffffff" text-anchor="middle">Dr. Anupriya</text>
  <text x="250" y="435" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="15" fill="#2dd4bf" text-anchor="middle">Founder & Chief Dental Surgeon</text>
  <text x="250" y="456" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="13" fill="#94a3b8" text-anchor="middle">BDS • 20+ Yrs Clinical Experience</text>
</svg>